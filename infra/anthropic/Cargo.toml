[package]
name = "maia-anthropic"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
maia-roundtable = { path = "../../roundtable" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
maia-domain = { path = "../../core/domain" }

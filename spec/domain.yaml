    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  AgentTaskId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  ExecutionPlanId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  ActionId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  RunId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  ApprovalId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  ConnectorProfileId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  ModelProfileId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  AuditId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  ArtifactId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  EvidenceImportRequestId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  TenantId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  MembershipId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  EntitlementId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  OutcomeId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  UsageRecordId:
    wire_type: string
    format: uuid
    uuid_version: 7
    canonical_text: lowercase_hyphenated
    rust_type: distinct_strong_newtype
  Utf8String:
    wire_type: string
    encoding: UTF-8
  NonEmptyString:
    wire_type: string
    encoding: UTF-8
    min_length: 1
  PolicyId:
    wire_type: string
    encoding: UTF-8
    min_length: 1
    semantics: opaque
    normalization: none
    uuid_required: false
  ActorRef:
    wire_type: string
    encoding: UTF-8
    min_length: 1
    semantics: opaque
    normalization: none
    represents: authorized_user_service_or_policy_actor
  OpaqueRef:
    wire_type: string
    encoding: UTF-8
    min_length: 1
    semantics: opaque
    normalization: none
    infer_path_or_uri_semantics: false
  SurfaceId:
    wire_type: string
    encoding: UTF-8
    min_length: 1
    registry: open
    examples_non_normative:
    - desktop
    - teams
    - outlook
    - web
  ActionType:
    wire_type: string
    pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
  Timestamp:
    wire_type: string
    format: RFC3339
    timezone: UTC
    canonical_serialization: YYYY-MM-DDTHH:MM:SS.sssZ
    fractional_second_digits: 3
    canonical_timezone_suffix: Z
    parser_acceptance: valid_RFC3339_may_be_accepted_and_normalized
  Version:
    wire_type: integer
    signed: false
    bits: 64
    minimum: 1
    maximum: 18446744073709551615
    monotonic_scope: versioned_aggregate_or_object
    monotonically_increases: true
    overflow: fail_closed_never_wrap_saturate_or_reuse
  Ordinal:
    wire_type: integer
    signed: false
    bits: 32
    minimum: 0
    maximum: 4294967295
  Attempt:
    wire_type: integer
    signed: false
    bits: 32
    minimum: 1
    maximum: 4294967295
  AuditSequence:
    wire_type: integer
    signed: false
    bits: 64
    minimum: 1
    maximum: 18446744073709551615
    monotonic_scope: workspace_audit_chain
    monotonically_increases: true
    overflow: fail_closed_never_wrap_saturate_or_reuse
  AmountMicros:
    wire_type: integer
    signed: false
    bits: 64
    minimum: 0
    maximum: 18446744073709551615
  AmountMinor:
    wire_type: integer
    signed: false
    bits: 64
    minimum: 0
    maximum: 18446744073709551615
  UsageQuantity:
    wire_type: integer
    signed: false
    bits: 64
    minimum: 0
    maximum: 18446744073709551615
  ByteCount:
    wire_type: integer
    signed: false
    bits: 64
    minimum: 0
    maximum: 18446744073709551615
  LineNumber:
    wire_type: integer
    signed: false
    bits: 64
    minimum: 1
    maximum: 18446744073709551615
  Sha256Hex:
    wire_type: string
    pattern: ^[0-9a-f]{64}$
  CurrencyCode:
    wire_type: string
    pattern: ^[A-Z]{3}$
    semantics: ISO-4217-compatible_code_shape
  PrivacyClass:
    wire_type: string
    enum_source: spec/modes.yaml#privacy_classes
    source_selection: mapping_keys
  RiskClass:
    wire_type: string
    enum_source: spec/approval.yaml#risk_classes
    source_selection: mapping_keys
  GateType:
    wire_type: string
    enum_source: spec/approval.yaml#gate_types
    source_selection: mapping_keys
  AgentTaskState:
    wire_type: string
    enum_source: spec/states.yaml#machines.AgentTaskState.states
    transitions_source: spec/states.yaml#machines.AgentTaskState.transitions
  ActionState:
    wire_type: string
    enum_source: spec/states.yaml#machines.ActionState.states
    transitions_source: spec/states.yaml#machines.ActionState.transitions
  RunState:
    wire_type: string
    enum_source: spec/states.yaml#machines.RunState.states
    transitions_source: spec/states.yaml#machines.RunState.transitions
  ApprovalState:
    wire_type: string
    enum_source: spec/states.yaml#machines.ApprovalState.states
    transitions_source: spec/states.yaml#machines.ApprovalState.transitions
  ConnectorSelection:
    wire_type: string
    enum_source: spec/action_binding.yaml#connector_selection.values
  PolicyDecision:
    wire_type: string
    enum_source: spec/approval.yaml#policy_decision.values
  ApprovalAssurance:
    wire_type: string
    enum_source: spec/approval.yaml#assurance.values
  ApprovalBindingValidity:
    wire_type: string
    enum_source: spec/approval.yaml#binding_validity.values
  ReconciliationResult:
    wire_type: string
    enum_source: spec/execution.yaml#reconciliation.values
  FreshnessResult:
    wire_type: string
    enum_source: spec/execution.yaml#freshness.values
  FreshnessEnforcement:
    wire_type: string
    enum_source: spec/execution.yaml#freshness.enforcement
  RecipientBoundary:
    wire_type: string
    enum_source: spec/approval.yaml#recipient_boundary.values
  AuditEventType:
    wire_type: string
    encoding: UTF-8
    min_length: 1
    semantics: validated_registry_identifier
  AuditSubjectType:
    wire_type: string
    encoding: UTF-8
    min_length: 1
    semantics: validated_registry_identifier
  ArtifactKind:
    wire_type: string
    enum_source: spec/domain.yaml#artifact_snapshot.artifact_kinds
  EvidenceMediaType:
    wire_type: string
    enum_source: spec/domain.yaml#artifact_snapshot.media_types
  OutcomeStatus:
    wire_type: string
    enum_source: spec/outcomes.yaml#lifecycle.statuses
  ReasoningAssuranceLevel:
    wire_type: string
    enum_source: spec/reasoning.yaml#assurance_levels
    source_selection: mapping_keys
  UsageCostStatus:
    wire_type: string
    enum_source: spec/commercial.yaml#usage.cost_statuses
value_objects:
  CostEstimate:
    fields:
      amount_micros:
        type: AmountMicros
        required: true
        nullable: false
      currency:
        type: CurrencyCode
        required: true
        nullable: false
    amount_unit: millionths_of_major_currency_unit
    floating_point_allowed: false
    informational_only: true
    authorizes_execution: false
    lowers_risk: false
  SourcePrecondition:
    fields:
      external_id:
        type: OpaqueRef
        required: true
        nullable: false
      source_version_token:
        type: OpaqueRef
        required: true
        nullable: false
      normalized_payload_hash:
        type: Sha256Hex
        required: true
        nullable: false
    semantics: freshness_condition_for_mutable_external_source
    connector_context: Action.connector_profile_id
    mismatch_policy_ref: spec/sync.yaml#pre_side_effect_freshness
    connector_specific_semantics: false
  OutcomeCertainty:
    wire_type: string
    values:
    - not_applicable
    - known
    - unknown
    state_source: spec/states.yaml#machines.RunState.states
    state_coupling:
      created: not_applicable
      starting: not_applicable
      running: not_applicable
      outcome_unknown: unknown
      reconciling: unknown
      retryable_error: known
      completed: known
      failed: known
      canceled: known
    reconciliation_resolution: unknown_to_known_only_when_outcome_resolved_enough_to_leave_reconciliation
  RiskSummary:
    wire_type: array
    items: RiskClass
    unique_items: true
    ordering: declaration_order
    ordering_source: spec/approval.yaml#risk_classes
    informational_only: true
    replaces_per_action_risk_or_gate: false
  CanonicalizerRef:
    fields:
      id:
        type: NonEmptyString
        required: true
        nullable: false
      version:
        type: Version
        required: true
        nullable: false
    semantics: versioned_action_type_specific_canonicalizer
  ReconciliationEvidence:
    fields:
      run_id:
        type: RunId
        required: true
        nullable: false
      action_id:
        type: ActionId
        required: true
        nullable: false
      action_version:
        type: Version
        required: true
        nullable: false
      action_hash:
        type: Sha256Hex
        required: true
        nullable: false
      effect_identity:
        type: OpaqueRef
        required: true
        nullable: false
      source_ref:
        type: OpaqueRef
        required: true
        nullable: false
      result:
        type: ReconciliationResult
        required: true
        nullable: false
    rules_ref: spec/execution.yaml#reconciliation
  FreshnessEvidence:
    fields:
      run_id:
        type: RunId
        required: true
        nullable: false
      action_id:
        type: ActionId
        required: true
        nullable: false
      action_version:
        type: Version
        required: true
        nullable: false
      action_hash:
        type: Sha256Hex
        required: true
        nullable: false
      enforcement:
        type: FreshnessEnforcement
        required: true
        nullable: false
      precondition:
        type: SourcePrecondition
        required: true
        nullable: false
      observed_source_version_token:
        type: OpaqueRef
        required: false
        nullable: true
      observed_payload_hash:
        type: Sha256Hex
        required: false
        nullable: true
      result:
        type: FreshnessResult
        required: true
        nullable: false
    rules_ref: spec/execution.yaml#freshness
artifact_snapshot:
  artifact_kinds:
  - imported_text_evidence
  media_types:
  - utf8_plain_text
  - markdown
  content_representation:
    decoding: strict_UTF-8
    newline_normalization: forbidden
    Unicode_normalization: forbidden
    content_sha256: SHA-256_over_exact_imported_source_bytes
    byte_length: exact_imported_source_byte_count
    snapshot_content: MAIA-owned_immutable_UTF-8_text
  provenance:
    source_locator: private_workspace_scoped_provenance_not_citation_identity
    source_locator_hash: SHA-256_over_exact_source_locator_UTF-8
  knowledge_boundary:
    creates_memory_claim: false
    creates_workgraph_edges: false
    infers_semantics: false
artifact_contracts:
  EvidenceImportSource:
    fields:
      source_locator:
        type: OpaqueRef
        required: true
        nullable: false
      name:
        type: NonEmptyString
        required: true
        nullable: false
      media_type:
        type: EvidenceMediaType
        required: true
        nullable: false
  EvidenceImportRequest:
    fields:
      id:
        type: EvidenceImportRequestId
        required: true
        nullable: false
      workspace_id:
        type: WorkspaceId
        required: true
        nullable: false
      requested_by:
        type: ActorRef
        required: true
        nullable: false
      requested_at:
        type: Timestamp
        required: true
        nullable: false
      sources:
        type: list<EvidenceImportSource>
        required: true
        nullable: false
    rules:
      input_paths_are_host_boundary: true
      persisted_request_identity: EvidenceImportRequestId
      partial_success: forbidden
  Artifact:
    fields:
      id:
        type: ArtifactId
        required: true
        nullable: false
      workspace_id:
        type: WorkspaceId
        required: true
        nullable: false
      kind:
        type: ArtifactKind
        required: true
        nullable: false
      name:
        type: NonEmptyString
        required: true
        nullable: false
      media_type:
        type: EvidenceMediaType
        required: true
        nullable: false
      content:
        type: Utf8String
        required: true
        nullable: false
      content_sha256:
        type: Sha256Hex
        required: true
        nullable: false
      byte_length:
        type: ByteCount
        required: true
        nullable: false
      source_locator:
        type: OpaqueRef
        required: true
        nullable: false
      source_locator_hash:
        type: Sha256Hex
        required: true
        nullable: false
      import_request_id:
        type: EvidenceImportRequestId
        required: true
        nullable: false
      trust:
        type: OpaqueRef
        required: true
        nullable: false
      classification:
        type: OpaqueRef
        required: true
        nullable: false
      created_at:
        type: Timestamp
        required: true
        nullable: false
    rules:
      immutable_after_write: true
      content_is_MAIA_owned_snapshot: true
      source_locator_is_private_provenance: true
      source_modification_or_deletion_changes_snapshot: false
      semantic_extraction: forbidden
  EvidenceCitation:
    fields:
      workspace_id:
        type: WorkspaceId
        required: true
        nullable: false
      artifact_id:
        type: ArtifactId
        required: true
        nullable: false
      content_sha256:
        type: Sha256Hex
        required: true
        nullable: false
      start_line:
        type: LineNumber
        required: false
        nullable: true
      end_line:
        type: LineNumber
        required: false
        nullable: true
    rules:
      canonical_identity: [workspace_id, artifact_id, content_sha256, start_line, end_line]
      external_source_locator_is_citation_identity: false
      line_positions_reference: immutable_MAIA_snapshot
      line_range: both_absent_for_artifact_citation_or_both_present_inclusive_start_lte_end

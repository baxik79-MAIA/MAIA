<rect x="316" y="104" width="716" height="772" rx="18" fill="#101a2b"/><text x="354" y="159" fill="#f6f7fb" font-family="Segoe UI" font-size="28" font-weight="700">What would you like to understand?</text><text x="354" y="190" fill="#95a8ca" font-family="Segoe UI" font-size="16">MAIA works from selected local evidence and always shows her sources.</text><rect x="354" y="236" width="640" height="186" rx="14" fill="#18263d"/><text x="382" y="276" fill="#e9effc" font-family="Segoe UI" font-size="17">The launch plan depends on two owned services and a staged rollout.</text><text x="382" y="318" fill="#c3d0e8" font-family="Segoe UI" font-size="15">[1] Project Notes · lines 12–18</text><text x="382" y="352" fill="#c3d0e8" font-family="Segoe UI" font-size="15">Inference · confirm ownership before scheduling.</text><rect x="354" y="796" width="640" height="50" rx="14" fill="#1c2b44"/><text x="379" y="827" fill="#aabadd" font-family="Segoe UI" font-size="16">Ask MAIA about these sources…</text><text x="948" y="827" fill="#9ee6d2" font-family="Segoe UI" font-size="16">Send ↑</text>
<rect x="1052" y="104" width="364" height="772" rx="18" fill="#121c2e"/><text x="1080" y="148" fill="#cbd6ec" font-family="Segoe UI" font-size="13">EVIDENCE &amp; CITATIONS</text><rect x="1080" y="178" width="308" height="146" rx="12" fill="#1b2a43"/><text x="1102" y="214" fill="#eef3ff" font-family="Segoe UI" font-size="16" font-weight="700">[1] Project Notes</text><text x="1102" y="242" fill="#a9bbda" font-family="Segoe UI" font-size="14">Immutable snapshot · 12–18</text><text x="1102" y="278" fill="#d2ddf1" font-family="Segoe UI" font-size="14">“Two owned services are required…”</text><text x="1080" y="370" fill="#cbd6ec" font-family="Segoe UI" font-size="13">MAIA</text><text x="1080" y="402" fill="#eef3ff" font-family="Segoe UI" font-size="16">Calm, local, evidence-backed.</text><text x="1080" y="430" fill="#91a4c7" font-family="Segoe UI" font-size="14">No cloud fallback. No actions.</text></svg>
